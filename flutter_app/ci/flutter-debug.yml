# Builds a debug APK of the Flutter app and attaches it to the run (Actions > the run > Artifacts).
# It installs next to the real app (package com.tunisiaflicks.app.debug), never over it.
#
# Move this file to .github/workflows/flutter-debug.yml (GitHub's web editor can rename a file
# into another folder). Run it from Actions > "Flutter debug APK" > Run workflow.
#
# First run only: if flutter_app/ is not in the repository yet but tunisiaflicks-flutter-phase0-1.zip
# is at the repository root, the job unpacks it, commits flutter_app/ and removes the zip.
name: Flutter debug APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-debug.yml'

permissions:
  contents: write

concurrency:
  group: flutter-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Unpack the uploaded project (first run only)
        run: |
          if [ ! -f flutter_app/pubspec.yaml ]; then
            zip=$(ls tunisiaflicks-flutter-*.zip 2>/dev/null | head -n 1 || true)
            if [ -z "$zip" ]; then
              echo "::error::Upload tunisiaflicks-flutter-phase0-1.zip to the repository root first"
              exit 1
            fi
            unzip -q -o "$zip"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git rm -q "$zip"
            git add flutter_app
            git commit -q -m "Add the Flutter app (phases 0-1)"
            git push origin HEAD
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create and configure the Android project
        working-directory: flutter_app
        run: python3 tool/bootstrap_android.py

      - name: Dependencies
        working-directory: flutter_app
        run: flutter pub get

      # Informational for now: a lint or test problem does not stop the APK from building.
      - name: Analyze
        working-directory: flutter_app
        continue-on-error: true
        run: flutter analyze

      - name: Test
        working-directory: flutter_app
        continue-on-error: true
        run: flutter test

      - name: Build the debug APK
        working-directory: flutter_app
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: tunisiaflicks-debug-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
