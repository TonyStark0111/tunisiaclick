# Builds the signed release APK of the Flutter app and publishes it as a GitHub PRERELEASE.
#
# Move this file to .github/workflows/flutter-android.yml when the debug build works.
# Push a tag like flutter-v1.0.0 to run it.
#
# Why a prerelease and a flutter-v tag: the site's /download/android only reads non-prerelease
# releases tagged android-vX.Y.Z (src/lib/app-releases.ts), so test builds never reach users.
# At cutover (phase 6), android-apps.yml builds the phone APK from flutter_app instead of
# android/phone, with the same asset name and release-notes format.
#
# Uses the same repository secrets as android-apps.yml (same key, so an installed TWA upgrades in
# place): ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
name: Flutter Android release

on:
  push:
    tags: ['flutter-v*']

permissions:
  contents: write

concurrency:
  group: flutter-android-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Read the version from the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^flutter-v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tags must look like flutter-v1.2.3"
            exit 1
          fi
          major=${BASH_REMATCH[1]}; minor=${BASH_REMATCH[2]}; patch=${BASH_REMATCH[3]}
          if (( minor > 99 || patch > 99 )); then
            echo "::error::Minor and patch go up to 99"
            exit 1
          fi
          # Same formula as android-apps.yml, so version codes keep rising across both pipelines.
          echo "name=$major.$minor.$patch" >> "$GITHUB_OUTPUT"
          echo "code=$(( major * 10000 + minor * 100 + patch ))" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Decode the keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::Set the ANDROID_KEYSTORE_BASE64 repository secret (docs/apps.md)"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Create and configure the Android project
        working-directory: flutter_app
        run: python3 tool/bootstrap_android.py

      - name: Build the signed APK
        working-directory: flutter_app
        env:
          TF_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          TF_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TF_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TF_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter pub get
          flutter build apk --release \
            --build-name="${{ steps.version.outputs.name }}" \
            --build-number="${{ steps.version.outputs.code }}"
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/tunisiaflicks-android.apk"

      - name: Check the signature and compute the checksums
        id: sums
        run: |
          cd "$RUNNER_TEMP"
          apksigner="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner"
          "$apksigner" verify --verbose tunisiaflicks-android.apk
          cert=$("$apksigner" verify --print-certs tunisiaflicks-android.apk | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')
          sha256sum tunisiaflicks-android.apk > SHA256SUMS
          echo "android=$(sha256sum tunisiaflicks-android.apk | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "cert=$cert" >> "$GITHUB_OUTPUT"
          rm -f release.jks

      - name: Publish the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          NAME: ${{ steps.version.outputs.name }}
          ANDROID_SHA: ${{ steps.sums.outputs.android }}
          CERT_SHA: ${{ steps.sums.outputs.cert }}
        run: |
          # Same "SHA-256" line format the site reads (src/lib/app-releases.ts).
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          TunisiaFlicks Flutter build for Android phones, version $NAME (test build, not offered on the site).

          - tunisiaflicks-android.apk SHA-256: \`$ANDROID_SHA\`
          - Signing certificate SHA-256: \`$CERT_SHA\`
          EOF
          gh release create "$TAG" \
            "$RUNNER_TEMP/tunisiaflicks-android.apk" "$RUNNER_TEMP/SHA256SUMS" \
            --prerelease --title "Flutter Android $NAME (test)" --notes-file "$RUNNER_TEMP/notes.md"
