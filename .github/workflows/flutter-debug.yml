# Builds a debug APK of the Flutter app and attaches it to the run (Actions > the run > Artifacts).
# It installs next to the real app (package com.tunisiaflicks.app.debug), never over it.
#
# Put this file at .github/workflows/flutter-debug.yml on your branch.
# The Flutter project must already be in the repository, in a folder named flutter_app (or flutter),
# with pubspec.yaml directly inside it, next to lib/, tool/ and android_overlay/.
name: Flutter debug APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'flutter_app/**'
      - 'flutter/**'
      - '.github/workflows/flutter-debug.yml'

permissions:
  contents: read

concurrency:
  group: flutter-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Find the Flutter project
        id: proj
        run: |
          for d in flutter_app flutter; do
            if [ -f "$d/pubspec.yaml" ]; then
              echo "dir=$d" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error::No pubspec.yaml found in flutter_app/ or flutter/. Put the project files directly in that folder."
          exit 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create and configure the Android project
        working-directory: ${{ steps.proj.outputs.dir }}
        run: python3 tool/bootstrap_android.py

      - name: Dependencies
        working-directory: ${{ steps.proj.outputs.dir }}
        run: flutter pub get

      # Informational for now: a lint or test problem does not stop the APK from building.
      - name: Analyze
        working-directory: ${{ steps.proj.outputs.dir }}
        continue-on-error: true
        run: flutter analyze

      - name: Test
        working-directory: ${{ steps.proj.outputs.dir }}
        continue-on-error: true
        run: flutter test

      - name: Build the debug APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: tunisiaflicks-debug-apk
          path: ${{ steps.proj.outputs.dir }}/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
